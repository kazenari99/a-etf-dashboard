name: Publish ETF dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data integrity rules
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        id: snapshot-cache
        with:
          path: |
            data_cache/hithink_klines.json
            reports/etf_data.json
          key: etf-snapshot-v2-${{ github.run_id }}
          restore-keys: etf-snapshot-v2-
      # Code pushes re-render the last fetched batch; schedule/manual runs fetch.
      # Render falls back to a full fetch when the cache is missing or incomplete.
      - name: Generate dashboard from Tonghuashun
        env:
          HITHINK_API_KEY: ${{ secrets.HITHINK_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          CACHE_MATCHED: ${{ steps.snapshot-cache.outputs.cache-matched-key }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$CACHE_MATCHED" ] && python radar.py --render; then
            echo "Re-rendered cached snapshot without calling the API"
          else
            python radar.py
          fi
      - name: Archive research run
        uses: actions/upload-artifact@v4
        with:
          name: etf-research-${{ github.run_id }}
          path: archive/
          retention-days: 90
          if-no-files-found: ignore
      - name: Stage public assets only
        run: |
          mkdir -p public
          cp index.html public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
