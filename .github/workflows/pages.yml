name: Publish ETF dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test data integrity rules
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: data_cache/hithink_klines.json
          key: etf-hithink-v1-${{ github.run_id }}
          restore-keys: etf-hithink-v1-
      - name: Generate dashboard from Tonghuashun
        env:
          HITHINK_API_KEY: ${{ secrets.HITHINK_API_KEY }}
        run: python radar.py
      - name: Archive research run
        uses: actions/upload-artifact@v4
        with:
          name: etf-research-${{ github.run_id }}
          path: archive/
          retention-days: 90
      - name: Stage public assets only
        run: |
          mkdir -p public/reports
          cp index.html public/
          cp reports/etf_dashboard.html reports/etf_data.json public/reports/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
